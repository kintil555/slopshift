   * ever drives ONE local player — the networking layer always reads
   * getPlayerState(0), i.e. WASD/E — so we collapse to a single stick
   * on the right with the grab button on the left.
   */
  if (isTouch) {
    document.body.classList.add("is-touch-device");
    const input = game.input;

    function setKey(code, down) {
      if (!code || !input) return;
      if (down) {
        if (!input.held.has(code)) {
          input.held.add(code);
          input.pressed.add(code);
          input.heldSince.set(code, performance.now());
        }
      } else if (input.held.delete(code)) {
        input.released.add(code);
        input.heldSince.delete(code);
      }
    }

    const touchRoot = document.createElement("div");
    touchRoot.id = "slop-touch-controls";
    shell.appendChild(touchRoot);

    function makeStick(keys, side) {
      const wrap = document.createElement("div");
      wrap.className = "slop-touch-stick slop-touch-stick-" + side;
      const base = document.createElement("div");
      base.className = "slop-touch-stick-base";
      const knob = document.createElement("div");
      knob.className = "slop-touch-stick-knob";
      base.appendChild(knob);
      wrap.appendChild(base);
      touchRoot.appendChild(wrap);

      let activeId = null, cx = 0, cy = 0;
      const RADIUS = 46;
      let curUp=false, curDown=false, curLeft=false, curRight=false;

      function updateDir(dx, dy) {
        const dist = Math.hypot(dx, dy);
        const clamped = Math.min(dist, RADIUS);
        const ang = Math.atan2(dy, dx);
        const kx = Math.cos(ang) * clamped, ky = Math.sin(ang) * clamped;
        knob.style.transform = "translate(" + kx + "px," + ky + "px)";
        const dead = 12;
        const nUp = dy < -dead, nDown = dy > dead, nLeft = dx < -dead, nRight = dx > dead;
        if (nUp !== curUp) { setKey(keys.up, nUp); curUp = nUp; }
        if (nDown !== curDown) { setKey(keys.down, nDown); curDown = nDown; }
        if (nLeft !== curLeft) { setKey(keys.left, nLeft); curLeft = nLeft; }
        if (nRight !== curRight) { setKey(keys.right, nRight); curRight = nRight; }
      }
      function resetDir() {
        knob.style.transform = "translate(0,0)";
        if (curUp) setKey(keys.up, false);
        if (curDown) setKey(keys.down, false);
        if (curLeft) setKey(keys.left, false);
        if (curRight) setKey(keys.right, false);
        curUp = curDown = curLeft = curRight = false;
      }
      function start(e) {
        const t = e.changedTouches ? e.changedTouches[0] : e;
        if (activeId !== null) return;
        activeId = t.identifier === undefined ? "mouse" : t.identifier;
        const rect = base.getBoundingClientRect();
        cx = rect.left + rect.width / 2;
        cy = rect.top + rect.height / 2;
        wrap.classList.add("is-active");
        move(e);
        e.preventDefault();
      }
      function move(e) {
        const touches = e.changedTouches ? e.changedTouches : [e];
        for (const t of touches) {
          const id = t.identifier === undefined ? "mouse" : t.identifier;
          if (id !== activeId) continue;
          updateDir(t.clientX - cx, t.clientY - cy);
        }
        if (e.cancelable) e.preventDefault();
      }
      function end(e) {
        const touches = e.changedTouches ? e.changedTouches : [e];
        for (const t of touches) {
          const id = t.identifier === undefined ? "mouse" : t.identifier;
          if (id !== activeId) continue;
          activeId = null;
          wrap.classList.remove("is-active");
          resetDir();
        }
      }
      wrap.addEventListener("touchstart", start, {passive:false});
      wrap.addEventListener("touchmove", move, {passive:false});
      wrap.addEventListener("touchend", end);
      wrap.addEventListener("touchcancel", end);
      return {wrap, reset: resetDir};
    }

    function makeGrabButton(cls, keyCode, side) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "slop-touch-action " + cls;
      btn.textContent = keyCode === KEY_P1.interact ? "E" : "/";
      btn.style[side] = "0";
      touchRoot.appendChild(btn);
      const onDown = (e) => { setKey(keyCode, true); e.preventDefault(); };
      const onUp = (e) => { setKey(keyCode, false); e.preventDefault(); };
      btn.addEventListener("touchstart", onDown, {passive:false});
      btn.addEventListener("touchend", onUp);
      btn.addEventListener("touchcancel", onUp);
      btn.addEventListener("mousedown", onDown);
      btn.addEventListener("mouseup", onUp);
      return btn;
    }

    // Build both layouts up front; toggle visibility based on network mode.
    const stickP1Left = makeStick(KEY_P1, "left");     // local co-op P1 (left)
    const stickP1Right = makeStick(KEY_P1, "right");   // online solo (right)
    const stickP2Right = makeStick(KEY_P2, "right");   // local co-op P2 (right)
    stickP1Left.wrap.classList.add("slop-mode-local");
    stickP2Right.wrap.classList.add("slop-mode-local");
    stickP1Right.wrap.classList.add("slop-mode-online");

    const grabLeftLocal = makeGrabButton("slop-touch-interact-p1 slop-mode-local", KEY_P1.interact, "left");
    const grabRightLocal = makeGrabButton("slop-touch-interact-p2 slop-mode-local", KEY_P2.interact, "right");
    const grabLeftOnline = makeGrabButton("slop-touch-interact-left slop-mode-online", KEY_P1.interact, "left");

    function isOnline() {
      const net = window.__SLOP_SHIFT_NET__;
      return !!(net && net.slot !== null && net.slot !== undefined);
    }
    function syncLayoutMode() {
      const online = isOnline();
      touchRoot.classList.toggle("is-online-mode", online);
      touchRoot.classList.toggle("is-local-mode", !online);
      if (online) { stickP1Left.reset(); stickP2Right.reset(); }
      else { stickP1Right.reset(); }
    }
    setInterval(syncLayoutMode, 200);
    syncLayoutMode();

    const startBtn = document.querySelector('[data-screen="title"] [data-action="start"]');
    if (startBtn) startBtn.addEventListener("click", () => { if (!isFs()) toggleFs(); }, {once:true});
  }

  /* ---------- Show gameplay controls only during actual play ---------- */
  const playChrome = document.getElementById("slop-touch-controls");
  function syncChromeVisibility() {
    const playing = game.state === "playing" || game.state === "countdown";
    if (playChrome) playChrome.classList.toggle("is-hidden", !playing);
  }
  setInterval(syncChromeVisibility, 150);
  syncChromeVisibility();

  /* ---------- Styles ---------- */
  const style = document.createElement("style");
  style.textContent =
    "#slop-fullscreen-btn{position:absolute;top:12px;right:12px;z-index:6;width:40px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(10,14,16,.55);color:#f4f3e7;font-size:18px;cursor:pointer;pointer-events:auto;backdrop-filter:blur(4px)}" +
    "#slop-fullscreen-btn.is-active{background:rgba(120,190,160,.35)}" +
    "#slop-gfx-settings{position:absolute;top:12px;right:60px;z-index:6;display:flex;align-items:center;gap:4px;background:rgba(10,14,16,.55);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:4px 6px;pointer-events:auto;backdrop-filter:blur(4px)}" +
    "#slop-gfx-settings .slop-gfx-label{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#c9c8ba;margin-right:4px}" +
    ".slop-gfx-btn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid transparent;background:transparent;color:#e7e6da;cursor:pointer}" +
    ".slop-gfx-btn.is-active{background:rgba(120,190,160,.35);border-color:rgba(120,190,160,.6)}" +
    "body.is-touch-device #slop-gfx-settings{top:auto;bottom:12px;right:12px}" +
    "#slop-touch-controls{position:absolute;inset:0;z-index:6;pointer-events:none}" +
    "#slop-touch-controls.is-hidden{display:none}" +
    "#slop-touch-controls .slop-touch-stick,#slop-touch-controls .slop-touch-action{pointer-events:auto}" +
    "#slop-touch-controls.is-local-mode .slop-mode-online{display:none}" +
    "#slop-touch-controls.is-online-mode .slop-mode-local{display:none}" +
    ".slop-touch-stick{position:absolute;bottom:26px;z-index:6;width:120px;height:120px;touch-action:none}" +
    ".slop-touch-stick-left{left:22px}.slop-touch-stick-right{right:22px}" +
    ".slop-touch-stick-base{position:relative;width:100%;height:100%;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25)}" +
    ".slop-touch-stick-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.32);border:1px solid rgba(255,255,255,.5);transition:background .15s}" +
    ".slop-touch-stick.is-active .slop-touch-stick-knob{background:rgba(120,190,160,.65)}" +
    ".slop-touch-action{position:absolute;bottom:44px;z-index:6;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:20px;font-weight:700;touch-action:none}" +
    "#slop-touch-controls.is-local-mode .slop-touch-interact-p1{left:32px;bottom:170px}" +
    "#slop-touch-controls.is-local-mode .slop-touch-interact-p2{right:32px;bottom:170px}" +
    "#slop-touch-controls.is-online-mode .slop-touch-interact-left{left:32px;bottom:44px}" +
    "body.is-touch-device #game-shell{touch-action:none}" +
    "#slop-gfx-reload-notice{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);z-index:7;background:rgba(20,16,10,.92);color:#f4f3e7;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center;pointer-events:auto;white-space:nowrap}" +
    "#slop-gfx-reload-notice button{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(120,190,160,.35);color:#fff;cursor:pointer}" +
    "@media (min-width:900px){.slop-touch-stick,.slop-touch-action{transform:scale(1.1)}}";
  document.head.appendChild(style);
})();
</script>

<script>window.SLOP_SHIFT_RELAY_URL = "wss://slopshift.secret5.workers.dev";</script>
<script type="module">
/* SLOP SHIFT — remote co-op networking layer.
 * Peer-authoritative: BOTH clients run the real, unmodified Game simulation
 * locally (same _simulatePlayersAndVat path as single-player), so movement,
 * physics, and all animation (walk cycle, squash/stretch, wobble, etc.)
 * always run correctly on both sides — there is no "dumb spectator" client
 * that skips simulation and therefore looks frozen or stuck mid-pose.
 *
 * Each side is authoritative for its OWN player (slot 0 = host controls
 * player[0] with WASD, slot 1 = guest controls player[1] with WASD/IJKL —
 * the guest always reads its keys as "player 0" locally and we just target
 * the right index when applying them). Each side simulates the REMOTE
 * player too (so it's not frozen while waiting for network updates), but
 * every time a peer update arrives we snap-correct that remote player's
 * position/velocity toward what its owner reported, and blend the vat
 * state between both sides' local physics and whichever side currently
 * holds authority over the tug-of-war/vat contact response.
 *
 * The Durable Object relay is a dumb pass-through: it just forwards each
 * player's own state + input to the other peer, nothing more. See
 * src/room.js.
 */
(function () {
  "use strict";

  const RELAY_URL = window.SLOP_SHIFT_RELAY_URL || "wss://slopshift.secret5.workers.dev";
  const RELAY_HTTP = RELAY_URL.replace(/^wss:/, "https:").replace(/^ws:/, "http:");
  const STATE_HZ = 20;
  const STATE_INTERVAL = 1000 / STATE_HZ;
  const CORRECTION_RATE = 10; // how fast we blend toward the peer's reported transform each frame

  const game = window.__SLOP_SHIFT__;
  if (!game) {
    console.error("[net] Game instance not found; networking layer not attached.");
    return;
  }

  const net = {
    ws: null,
    slot: null, // 0 = host, 1 = guest
    myIndex: null, // which players[] entry this client owns (0 or 1)
    peerIndex: null, // which players[] entry the peer owns
    roomCode: null,
    connected: false,
    peerConnected: false,
    lastStateSendAt: 0,
    seq: 0,
    lastRecvSeq: -1,
    remoteTarget: null, // last state packet received from the peer
    onStatus: null, // UI callback
    onLobby: null, // UI callback: (players, hostSlot) => void
    onKicked: null, // UI callback: fired on the guest when the host kicks them
    onGameStart: null, // UI callback: fired on both clients when host starts the round
    lobbyPlayers: [], // last known [{slot,name,connected}]
    localName: "",
  };
  window.__SLOP_SHIFT_NET__ = net;

  // ---------- connection ----------

  async function createRoom() {
    const res = await fetch(`${RELAY_HTTP}/create`, { method: "POST" });
    const data = await res.json();
    return data.room;
  }

  function connect(roomCode, { asHost, name } = {}) {
    return new Promise((resolve, reject) => {
      const qs = name ? `?name=${encodeURIComponent(name)}` : "";
      const url = `${RELAY_URL}/ws/${roomCode}${qs}`;
      const ws = new WebSocket(url);
      net.ws = ws;
      net.roomCode = roomCode;
      net.localName = name || "";

      const timeout = setTimeout(() => reject(new Error("Connection timed out")), 8000);

      ws.addEventListener("open", () => {
        net.connected = true;
      });

      ws.addEventListener("message", (evt) => {
        let msg;
        try {
          msg = JSON.parse(evt.data);
        } catch {
          return;
        }
        handleMessage(msg, resolve, timeout);
      });

      ws.addEventListener("close", () => {
        net.connected = false;
        net.peerConnected = false;
        emitStatus("disconnected");
      });

      ws.addEventListener("error", () => {
        clearTimeout(timeout);
        reject(new Error("WebSocket error"));
      });
    });
  }

  function handleMessage(msg, resolveConnect, timeout) {
    switch (msg.t) {
      case "welcome":
        net.slot = msg.slot;
        net.myIndex = msg.slot === 0 ? 0 : 1;
        net.peerIndex = 1 - net.myIndex;
        clearTimeout(timeout);
        emitStatus(net.slot === 0 ? "hosting" : "joined");
        resolveConnect && resolveConnect(net.slot);
        break;
      case "peer-joined":
        net.peerConnected = true;
        emitStatus("peer-joined");
        break;
      case "peer-left":
        net.peerConnected = false;
        net.remoteTarget = null;
        emitStatus("peer-left");
        break;
      case "lobby":
        net.lobbyPlayers = msg.players || [];
        net.onLobby && net.onLobby(net.lobbyPlayers, msg.hostSlot ?? 0);
        break;
      case "kicked":
        net.onKicked && net.onKicked();
        break;
      case "start-game":
        net.onGameStart && net.onGameStart();
        break;
      case "state":
        // peer's own authoritative transform for the player they own
        if (msg.seq === -1 || msg.seq > net.lastRecvSeq) {
          net.lastRecvSeq = msg.seq;
          net.remoteTarget = msg.state;
        }
        break;
      case "event":
        applyRemoteEvents(msg.events);
        break;
      case "pong":
        break;
    }
  }

  function emitStatus(status) {
    net.onStatus && net.onStatus(status, net);
  }

  function send(obj) {
    if (net.ws && net.ws.readyState === WebSocket.OPEN) {
      net.ws.send(JSON.stringify(obj));
    }
  }

  // ---------- state exchange ----------
  // Each side reports ONLY its own player's transform (it owns that data),
  // plus enough vat info for the receiving side to reconcile the vat.

  function serializeOwnState() {
    const p = game.players[net.myIndex];
    const vatPos = game.vat.position || game.vat.group.position;
    const vatVel = game.vat.velocity;
    return {
      time: game.timeRemaining,
      elapsed: game.elapsed,
      score: game.score,
      slop: game.slopRemaining,
      accidents: game.accidents,
      samples: game.samplesCollected,
      checkpointIndex: game.checkpointIndex,
      gameState: game.state,
      countdown: game.countdown,
      player: {
        pos: [p.position.x, p.position.y, p.position.z],
        vel: [p.velocity.x, p.velocity.y, p.velocity.z],
        rotY: p.visual ? p.visual.rotation.y : 0,
        grabbing: p.isGrabbing,
        stumbling: p.isStumbling,
      },
      vat: {
        pos: [vatPos.x, vatPos.y, vatPos.z],
        vel: vatVel ? [vatVel.x, vatVel.y, vatVel.z] : [0, 0, 0],
        fill: game.vat.fillLevel,
        holders: game.vat.holders ? game.vat.holders.map((h) => !!h) : [false, false],
      },
    };
  }

  function applyRemoteEvents(events) {
    if (!Array.isArray(events)) return;
    for (const e of events) {
      if (e.type === "delivery-complete" || e.type === "checkpoint") {
        try {
          game._processLevelEvents([e], {});
        } catch {}
      }
    }
  }

  // ---------- per-frame hooks ----------
  // Both sides always run the REAL simulation for every player/vat, so
  // walk cycles, squash/stretch, stumble reactions etc. always play. We
  // just correct the remote player's transform toward the peer's report
  // afterward, instead of skipping simulation for it.

  const originalSimulate = game._simulatePlayersAndVat.bind(game);
  game._simulatePlayersAndVat = function (dt) {
    if (net.slot === null) {
      // Not networked: untouched local co-op behavior.
      originalSimulate(dt);
      return;
    }

    // Run the full local simulation for BOTH players and the vat, exactly
    // like single-player/local co-op. This guarantees animation always
    // runs on both clients — nothing is ever "just interpolated".
    originalSimulate(dt);

    // Correct the remote player toward what its owner last reported, and
    // gently reconcile the vat so both sides converge instead of diverging
    // from running two independent physics sims.
    reconcileWithPeer(dt);

    const now = performance.now();
    if (now - net.lastStateSendAt >= STATE_INTERVAL) {
      net.lastStateSendAt = now;
      net.seq += 1;
      send({ t: "state", state: serializeOwnState(), seq: net.seq });
    }
  };

  function reconcileWithPeer(dt) {
    const t = net.remoteTarget;
    if (!t) return;

    // Mirror low-frequency scalar game state from whichever side is host
    // (host stays the tie-breaker for round timer/score/etc. to avoid the
    // two sims slowly drifting apart on things like timeRemaining).
    if (net.slot === 1) {
      game.timeRemaining = t.time;
      game.score = t.score;
      game.slopRemaining = t.slop;
      game.accidents = t.accidents;
      game.samplesCollected = t.samples;
      game.checkpointIndex = t.checkpointIndex;
      game.countdown = t.countdown;
      if (t.gameState && game.state !== t.gameState) {
        game.state = t.gameState;
      }
    }

    // Correct the peer's own player toward their authoritative transform.
    const remotePlayer = game.players[net.peerIndex];
    if (remotePlayer && t.player) {
      const lerp = 1 - Math.exp(-dt * CORRECTION_RATE);
      remotePlayer.position.x += (t.player.pos[0] - remotePlayer.position.x) * lerp;
      remotePlayer.position.y += (t.player.pos[1] - remotePlayer.position.y) * lerp;
      remotePlayer.position.z += (t.player.pos[2] - remotePlayer.position.z) * lerp;
      if (t.player.vel) {
        remotePlayer.velocity.x = t.player.vel[0];
        remotePlayer.velocity.y = t.player.vel[1];
        remotePlayer.velocity.z = t.player.vel[2];
      }
      // Don't fight the peer's own facing/animation state — their local
      // sim already ran _animate() for their player this frame with
      // correct input, so only nudge position/velocity, not visuals.
    }

    // Vat: blend positions from both sides' independent physics so a vat
    // held by both players doesn't diverge. Host wins ties on fill level
    // since spill/delivery logic is easiest to keep single-sourced there.
    const vatPos = game.vat.position || game.vat.group.position;
    if (t.vat) {
      const vatLerp = 1 - Math.exp(-dt * (CORRECTION_RATE * 0.5));
      vatPos.x += (t.vat.pos[0] - vatPos.x) * vatLerp;
      vatPos.y += (t.vat.pos[1] - vatPos.y) * vatLerp;
      vatPos.z += (t.vat.pos[2] - vatPos.z) * vatLerp;
      if (net.slot === 1 && typeof game.vat.setFill === "function") {
        game.vat.setFill(t.vat.fill);
      }
    }
  }

  // Route input: each client only ever reads its OWN keyboard (always as
  // logical slot 0, i.e. WASD) and applies it to the players[] index it
  // owns. The remote player's input this frame doesn't matter for local
  // simulation since we correct its transform in reconcileWithPeer(), so
  // we just feed it a neutral/no-op input to keep its own local physics
  // stable between corrections.
  const originalGetPlayerState = game.input.getPlayerState.bind(game.input);
  const neutralInput = { moveX: 0, moveZ: 0, rawX: 0, rawZ: 0, moving: false, sprint: false, sprintPressed: false, interact: false, interactPressed: false, interactReleased: false };
  game.input.getPlayerState = function (index) {
    if (net.slot === null) return originalGetPlayerState(index);
    if (index === net.myIndex) {
      // Always read the local player's own keys as WASD (logical slot 0),
      // regardless of whether this client is host or guest.
      return originalGetPlayerState(0);
    }
    // Remote player: don't drive it from local keys; its position is
    // corrected from the network in reconcileWithPeer() every frame.
    return neutralInput;
  };

  // ---------- public API for menu/UI ----------

  window.SlopShiftNetworking = {
    async hostGame(name) {
      const code = await createRoom();
      await connect(code, { asHost: true, name });
      return code;
    },
    async joinGame(code, name) {
      await connect(code.toUpperCase(), { asHost: false, name });
    },
    setName(name) {
      net.localName = name || "";
      send({ t: "set-name", name: net.localName });
    },
    kickPeer() {
      // Only meaningful for the host; server also enforces this.
      if (net.slot === 0) send({ t: "kick" });
    },
    startGame() {
      // Only meaningful for the host; server also enforces this.
      if (net.slot === 0) send({ t: "start-game" });
    },
    leave() {
      if (net.ws) net.ws.close();
      net.slot = null;
      net.myIndex = null;
      net.peerIndex = null;
      net.roomCode = null;
      net.lobbyPlayers = [];
    },
    setStatusHandler(fn) {
      net.onStatus = fn;
    },
    setLobbyHandler(fn) {
      net.onLobby = fn;
    },
    setKickedHandler(fn) {
      net.onKicked = fn;
    },
    setGameStartHandler(fn) {
      net.onGameStart = fn;
    },
    getState: () => net,
  };
})();

</script>
<script type="module">
(function () {
  "use strict";
  function el(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === "style") e.style.cssText = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    kids.forEach((k) => e.appendChild(typeof k === "string" ? document.createTextNode(k) : k));
    return e;
  }

  const NAME_KEY = "slopshift-player-name";

  const barStyle =
    "position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;" +
    "background:color-mix(in srgb, var(--ink), transparent 6%);border:1px solid color-mix(in srgb, var(--acid), transparent 65%);" +
    "border-radius:12px;padding:12px 18px;font:14px Inter,ui-sans-serif,system-ui,sans-serif;" +
    "color:var(--cream);display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);";
  const panelStyle =
    "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;" +
    "background:color-mix(in srgb, var(--ink), transparent 4%);border:1px solid color-mix(in srgb, var(--acid), transparent 55%);" +
    "border-radius:18px;padding:24px 28px;font:14px Inter,ui-sans-serif,system-ui,sans-serif;" +
    "color:var(--cream);min-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.6);";
  const inputStyle =
    "width:90px;text-transform:uppercase;letter-spacing:2px;text-align:center;" +
    "background:var(--ink);border:1px solid color-mix(in srgb, var(--acid), transparent 60%);border-radius:8px;" +
    "color:var(--cream);padding:8px;font:14px monospace;";
  const nameInputStyle =
    "width:130px;background:var(--ink);border:1px solid color-mix(in srgb, var(--acid), transparent 60%);border-radius:8px;" +
    "color:var(--cream);padding:8px;font:14px Inter,ui-sans-serif,system-ui,sans-serif;";
  const btnStyle =
    "background:var(--acid);border:2px solid var(--ink);border-radius:8px;color:var(--ink);font-weight:800;" +
    "padding:8px 16px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;transition:filter .15s,transform .15s;";
  const btnStyleWide =
    "background:var(--acid);border:2px solid var(--ink);border-radius:10px;color:var(--ink);font-weight:800;" +
    "padding:12px 18px;cursor:pointer;width:100%;font-size:15px;text-transform:uppercase;letter-spacing:.5px;" +
    "transition:filter .15s,transform .15s;";
  const btnStyleDanger =
    "background:#7a2626;border:2px solid var(--ink);border-radius:8px;color:#ffe4e4;font-weight:700;" +
    "padding:5px 12px;cursor:pointer;font-size:12px;";
  const btnStyleGhost =
    "background:transparent;border:2px solid color-mix(in srgb, var(--cream), transparent 55%);border-radius:10px;" +
    "color:var(--cream);font-weight:700;padding:11px 16px;cursor:pointer;";

  // ---------- state ----------
  let mode = "menu"; // "menu" | "room"
  let savedName = "";
  try {
    savedName = localStorage.getItem(NAME_KEY) || "";
  } catch {}

  // ---------- menu bar (before joining/hosting) ----------
  const status = el("span", { style: "opacity:.75" }, "Local co-op");
  const nameInput = el("input", {
    style: nameInputStyle,
    placeholder: "Your name",
    maxlength: "16",
    value: savedName,
  });
  const codeInput = el("input", { style: inputStyle, placeholder: "CODE", maxlength: "5" });
  const hostBtn = el("button", { style: btnStyle }, "Host");
  const joinBtn = el("button", { style: btnStyle }, "Join");
  [hostBtn, joinBtn].forEach((b) => {
    b.addEventListener("mouseenter", () => (b.style.filter = "brightness(1.08)"));
    b.addEventListener("mouseleave", () => (b.style.filter = ""));
  });

  const menuBar = el("div", { style: barStyle }, status, nameInput, codeInput, joinBtn, hostBtn);
  document.body.appendChild(menuBar);

  // ---------- room panel (after connecting) ----------
  const roomTitle = el("div", { style: "font-weight:700;font-size:15px;margin-bottom:2px;" }, "Room");
  const roomCodeLabel = el("div", {
    style: "font:15px monospace;letter-spacing:3px;color:#8be08b;margin-bottom:12px;",
  });
  const playerList = el("div", { style: "display:flex;flex-direction:column;gap:6px;margin-bottom:12px;" });
  const roomStatusLine = el("div", { style: "opacity:.7;font-size:12px;margin-bottom:12px;min-height:16px;" });
  const startBtn = el("button", { style: btnStyleWide }, "Start Game");
  const leaveBtn = el("button", { style: btnStyleGhost + "margin-top:8px;width:100%;" }, "Leave Room");
  const buttonRow = el("div", { style: "display:flex;flex-direction:column;" }, startBtn, leaveBtn);

  const roomPanel = el(
    "div",
    { style: panelStyle + "display:none;" },
    roomTitle,
    roomCodeLabel,
    playerList,
    roomStatusLine,
    buttonRow
  );
  document.body.appendChild(roomPanel);

  function setStatus(text) {
    status.textContent = text;
  }

  function persistName() {
    const n = nameInput.value.trim();
    try {
      if (n) localStorage.setItem(NAME_KEY, n);
    } catch {}
    return n;
  }

  function showMenu() {
    mode = "menu";
    menuBar.style.display = "flex";
    roomPanel.style.display = "none";
  }

  function showRoom() {
    mode = "room";
    menuBar.style.display = "none";
    roomPanel.style.display = "block";
  }

  function playerRow({ slot, name, connected }, hostSlot, mySlot) {
    const isHost = slot === hostSlot;
    const isMe = slot === mySlot;
    const label = connected
      ? (name || (slot === 0 ? "Player 1" : "Player 2")) + (isMe ? " (You)" : "")
      : "Waiting for player…";

    const rowStyle =
      "display:flex;align-items:center;justify-content:space-between;gap:8px;" +
      "background:#0e1512;border:1px solid #24352b;border-radius:8px;padding:7px 10px;" +
      (connected ? "" : "opacity:.55;");

    const nameEl = el(
      "span",
      { style: "display:flex;align-items:center;gap:6px;" },
      el("span", { style: `font-weight:${isMe ? "700" : "500"};` }, label),
      isHost && connected ? el("span", { style: "font-size:11px;color:#f0c766;" }, "HOST") : ""
    );

    const kids = [nameEl];

    // Host sees a Kick button on the guest's row (slot 1), when connected.
    if (mySlot === hostSlot && slot !== hostSlot && connected) {
      const kickBtn = el("button", { style: btnStyleDanger }, "Kick");
      kickBtn.addEventListener("click", () => {
        window.SlopShiftNetworking.kickPeer();
      });
      kids.push(kickBtn);
    }

    return el("div", { style: rowStyle }, ...kids);
  }

  function renderLobby(players, hostSlot) {
    const net = window.SlopShiftNetworking.getState();
    const mySlot = net.slot;
    playerList.innerHTML = "";
    (players.length ? players : [{ slot: 0, connected: false }, { slot: 1, connected: false }]).forEach((p) => {
      playerList.appendChild(playerRow(p, hostSlot, mySlot));
    });

    const guest = players.find((p) => p.slot === 1);
    const iAmHost = mySlot === hostSlot;

    if (iAmHost) {
      startBtn.style.display = "block";
      startBtn.disabled = !guest || !guest.connected;
      startBtn.textContent = guest && guest.connected ? "Start Game" : "Waiting for a player…";
      roomStatusLine.textContent = guest && guest.connected
        ? "Everyone's here. Start whenever you're ready."
        : "Share the room code with your co-worker.";
    } else {
      startBtn.style.display = "none";
      roomStatusLine.textContent = "Waiting for the host to start the game…";
    }
  }

  hostBtn.addEventListener("click", async () => {
    const name = persistName();
    hostBtn.disabled = true;
    setStatus("Creating room…");
    try {
      const code = await window.SlopShiftNetworking.hostGame(name);
      roomCodeLabel.textContent = `Room: ${code}`;
      showRoom();
      setStatus("Hosting — waiting for a player…");
    } catch (err) {
      setStatus("Failed to host: " + err.message);
    } finally {
      hostBtn.disabled = false;
    }
  });

  joinBtn.addEventListener("click", async () => {
    const code = codeInput.value.trim();
    if (!code) return;
    const name = persistName();
    joinBtn.disabled = true;
    setStatus("Joining…");
    try {
      await window.SlopShiftNetworking.joinGame(code, name);
      roomCodeLabel.textContent = `Room: ${code.toUpperCase()}`;
      showRoom();
      setStatus("Connected");
    } catch (err) {
      setStatus("Failed to join: " + err.message);
    } finally {
      joinBtn.disabled = false;
    }
  });

  startBtn.addEventListener("click", () => {
    window.SlopShiftNetworking.startGame();
  });

  leaveBtn.addEventListener("click", () => {
    window.SlopShiftNetworking.leave();
    showMenu();
    setStatus("Local co-op");
    roomCodeLabel.textContent = "";
    playerList.innerHTML = "";
  });

  window.SlopShiftNetworking.setStatusHandler((s) => {
    const map = {
      hosting: "Hosting — waiting for a player…",
      joined: "Joined — syncing…",
      "peer-joined": "Player connected!",
      "peer-left": "Other player disconnected",
      disconnected: "Disconnected",
    };
    setStatus(map[s] || s);
    if (s === "disconnected" && mode === "room") {
      showMenu();
      roomCodeLabel.textContent = "";
      playerList.innerHTML = "";
    }
  });

  window.SlopShiftNetworking.setLobbyHandler((players, hostSlot) => {
    if (mode !== "room") showRoom();
    renderLobby(players, hostSlot);
  });

  window.SlopShiftNetworking.setKickedHandler(() => {
    window.SlopShiftNetworking.leave();
    showMenu();
    setStatus("You were kicked by the host");
    roomCodeLabel.textContent = "";
    playerList.innerHTML = "";
  });

  window.SlopShiftNetworking.setGameStartHandler(() => {
    // Fires on BOTH clients (host included, relayed back by the server)
    // so the round begins at the same moment for everyone. Hide the room
    // panel so it doesn't sit on top of the HUD during play.
    roomPanel.style.display = "none";
    const game = window.__SLOP_SHIFT__;
    if (game) {
      game.beginRound();
      game.start();
    }
  });

  // Re-show the room panel automatically if the round ends and we're
  // still connected to a room, so host/guest land back in the lobby
  // instead of the single-player title screen.
  const originalReturnToTitle = window.__SLOP_SHIFT__?.returnToTitle?.bind(window.__SLOP_SHIFT__);
  if (originalReturnToTitle) {
    window.__SLOP_SHIFT__.returnToTitle = function (...args) {
      originalReturnToTitle(...args);
      const net = window.SlopShiftNetworking.getState();
      if (net.slot !== null) {
        roomPanel.style.display = "block";
        renderLobby(net.lobbyPlayers, 0);
      }
    };
  }
})();

</script>
</body>
</html>
